# Use this file to run Justflows with MariaDB instead of PostgreSQL
# docker compose -f docker/docker-compose.mariadb.yml --env-file .env up

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_DATABASE: justflows
      MARIADB_USER: justflows
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.all
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env to a unique 32+ character string}
      DB_DRIVER: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: justflows
      DB_USER: justflows
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Runtime confinement. The image already runs as a non-root user; these
    # stop that user from regaining privilege, and bound what one runaway
    # request can consume on a box that is usually also serving the database.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # `read_only: true` is deliberately not set. The install wizard writes .env
    # into the application root, and plugin, theme and CSS-provider installs
    # write to packages-installed/ and css-providers-installed/ there too — so a
    # read-only root filesystem breaks setup and every extension install. Making
    # it work means relocating that state onto volumes first; until then the
    # flag would be a setting that looks like hardening and is actually an
    # outage.
    tmpfs:
      - /tmp
    volumes:
      - uploads:/app/uploads
      - jf_cache:/app/.cache
      - jf_tmp:/app/tmp
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  uploads:
  jf_cache:
  jf_tmp:

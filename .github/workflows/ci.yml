name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @justflows/core test
      - run: pnpm --filter @justflows/blocks test
      - run: pnpm --filter @justflows/installer test
      - run: pnpm --filter @justflows/plugin-api test
      - run: pnpm --filter @justflows/content test

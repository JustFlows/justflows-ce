name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop, developers]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.base_ref == 'develop' || github.base_ref == 'developers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@justflows/server..." build
      - run: pnpm assets:check
      - run: pnpm --filter @justflows/sdk test
      - run: pnpm sdk:api:check
      - run: pnpm --filter @justflows/core test
      - run: pnpm --filter @justflows/blocks test
      - run: pnpm --filter @justflows/media test
      - run: pnpm --filter @justflows/installer test
      - run: pnpm --filter @justflows/plugin-api test
      - run: pnpm --filter @justflows/content test
      - run: pnpm --filter @justflows/cache test
      - run: pnpm --filter @justflows/server test
      - run: pnpm --filter @justflows/sdk typecheck
      - run: pnpm --filter @justflows/core typecheck
      - run: pnpm --filter @justflows/installer typecheck
      - run: pnpm --filter @justflows/content typecheck
      - run: pnpm --filter @justflows/media typecheck
      - run: pnpm --filter @justflows/server typecheck

  security:
    if: github.base_ref == 'develop' || github.base_ref == 'developers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm scan:secrets

      # Fails the build on a high or critical advisory. Moderates are reported
      # but not blocking: the one currently outstanding (GHSA-67mh-4wv8-2f99)
      # is esbuild reached only through drizzle-kit's deprecated
      # @esbuild-kit/esm-loader — a dev dependency, used as a module loader and
      # never as a dev server, with no fixed release available upstream.
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Report moderate and low advisories
        if: always()
        run: pnpm audit --audit-level low || true

  security-database:
    if: github.base_ref == 'develop' || github.base_ref == 'developers'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: postgres
            port: 5432
          - driver: mysql
            port: 3306
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: security_test
          POSTGRES_USER: justflows
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justflows -d security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:9.5
        env:
          MYSQL_DATABASE: security_test
          MYSQL_USER: justflows
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECURITY_TEST_DATABASE: "1"
      DB_DRIVER: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_NAME: security_test
      DB_USER: justflows
      DB_PASSWORD: test-password
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fresh install and upgrade migrations
        run: pnpm --filter @justflows/server exec vitest run tests/integration/database/security-migrations-db.integration.test.ts
      - name: Shared job claims
        run: pnpm --filter @justflows/server exec vitest run tests/integration/database/job-queue-db.integration.test.ts
      - name: Transactional concurrency
        run: pnpm --filter @justflows/server exec vitest run tests/integration/database/plugin-rows-db.integration.test.ts
      - name: Plugin schema upgrades
        run: pnpm --filter @justflows/server exec vitest run tests/integration/database/plugin-schema-upgrade-db.integration.test.ts

  codeql:
    if: github.base_ref == 'develop' || github.base_ref == 'developers'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4

  from-develop:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # justflows-ce-development cuts main from `develop`; justflows-ce cuts
      # main from `developers` (that repo has no `develop` branch).
      - name: Require develop or developers as the source branch
        run: |
          if [ "${GITHUB_HEAD_REF}" != "develop" ] && [ "${GITHUB_HEAD_REF}" != "developers" ]; then
            echo "::error::PRs into main must come from develop (justflows-ce-development) or developers (justflows-ce)."
            exit 1
          fi

  # Never add actions/dependency-review-action as a required job. It needs
  # GitHub Dependency graph, which is not enabled on this public repository, and
  # fails with "Dependency review is not supported on this repository."
  # Advisory gating is the security job's `pnpm audit --audit-level high`.

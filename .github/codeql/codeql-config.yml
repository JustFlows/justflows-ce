# CodeQL configuration for the advanced code-scanning workflow
# (.github/workflows/ci.yml, job `codeql`).
#
# The `security-extended` query suite is kept in full, with two queries
# disabled:
#
#   js/http-to-file-access  —  "Network data written to file"
#
#     The static-export subsystem (apps/server/src/lib/static-export) exists to
#     fetch this site's own pages over HTTP and write them to a directory a
#     static host then serves: writing crawled bytes to disk is the feature.
#     The crawl origin is restricted to loopback or an operator-configured
#     origin (`assertExportOrigin`), the output directory is contained under the
#     app root, and the manifest is run through `sanitizeManifest` (numeric
#     coercion, per-field whitelists, control-character stripping, length caps)
#     immediately before it is written. This query only reports design-inherent
#     noise for this repository.
#
#   js/insufficient-password-hash  —  "Use of password hash with insufficient
#                                      computational effort"
#
#     The only hit is `cacheFileName` in packages/cache/src/filesystem.ts,
#     which SHA-256s an arbitrary cache key into a fixed-length filename. The
#     name-based "sensitive data" heuristic keeps finding new sources that
#     reach some cache key (`passwordResetEnabled` settings, `apiKeyOwner`),
#     and inline `codeql[...]` suppressions are not honoured by code scanning.
#     Passwords are hashed in packages/auth/src/password.ts with PBKDF2-SHA256
#     at 310k iterations; API keys are random tokens, where a fast hash is
#     correct.
name: "JustFlows CodeQL config"

query-filters:
  - exclude:
      id: js/http-to-file-access
  - exclude:
      id: js/insufficient-password-hash

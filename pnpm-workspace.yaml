packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "themes/*"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - turbo@2.10.11
  - vitest@4.1.11
  - mysql2@3.24.1

overrides:
  "undici@>=8.0.0 <8.10.2": 8.10.2
  "proxy-addr@<2.0.8": 2.0.8
  "source-map-js@<1.2.2": 1.2.2
  "qs@<6.16.0": 6.16.0
  "ip-address@<10.7.4": 10.7.4
  "esbuild@<0.25.0": 0.25.12

# picomatch ReDoS (GHSA-fc5q-39xc-vjpf): no fixed release exists yet (latest
# 4.0.7 is affected). It only reaches build and test tools (vite, vitest,
# tinyglobby); `pnpm audit --prod` has no high findings. Remove this entry
# once picomatch ships a fix, and update the lockfile.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
